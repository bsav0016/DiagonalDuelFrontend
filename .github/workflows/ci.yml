# Pull-request checks only. App builds and store releases (EAS) are separate and not triggered from here.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Errors fail the build; the existing style warnings do not.
      - name: Lint
        run: npm run lint

      # Game rules, win detection, the Game model, the computer opponent and URL selection.
      - name: Tests
        run: npx jest --ci

      # Bundles the JavaScript for Android. Catches broken imports and routes without native tooling.
      - name: Build check
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
